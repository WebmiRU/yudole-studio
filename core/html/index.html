<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yudole studio light</title>
</head>
<body class="page-home">

<main class="home">
    <header class="home__head">
        <span class="home__mark" aria-hidden="true">◈</span>
        <span class="home__name">Yudole studio light</span>
    </header>
    <p class="home__lead">Лента чатов в одном окне. Выберите раздел.</p>

    <nav class="cards" aria-label="Разделы">

        <a class="card" href="/chat">
            <span class="card__title">Чат</span>
            <span class="card__note">Живая лента сообщений из всех подключённых каналов</span>
        </a>

        <a class="card" href="/settings">
            <span class="card__title">Настройки</span>
            <span class="card__note">Чат-клиенты, каналы и ключи подключения</span>
        </a>

        <!-- Разделы ниже ещё не сделаны. Кнопки оставлены на своих местах:
             меню должно показать, что задумано, и не давать тыкнуть в пустоту. -->
        <button type="button" class="card card--soon" disabled>
            <span class="card__title">Панель управления
                <span class="card__badge">скоро</span></span>
            <span class="card__note">Управление стримами и каналами в одном месте</span>
        </button>

        <button type="button" class="card card--soon" disabled>
            <span class="card__title">Каналы
                <span class="card__badge">скоро</span></span>
            <span class="card__note">Список каналов на всех площадках сразу</span>
        </button>

        <button type="button" class="card card--soon" disabled>
            <span class="card__title">Темы
                <span class="card__badge">скоро</span></span>
            <span class="card__note">Оформление интерфейса</span>
        </button>

    </nav>
</main>

<script type="module" src="/js/home.js"></script>
</body>
</html>
