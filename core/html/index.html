<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yudole studio light</title>
</head>
<body class="page-home">

<main class="home">
    <header class="home__head">
        <span class="home__mark" aria-hidden="true">◈</span>
        <span class="home__name">Yudole studio light</span>
    </header>
    <p class="home__lead">Лента чатов в одном окне. Выберите раздел.</p>

    <nav class="home__grid" aria-label="Разделы">

        <a class="home__card" href="/chat">
            <span class="home__card-title">Чат</span>
            <span class="home__card-note">Живая лента сообщений из всех подключённых каналов</span>
        </a>

        <a class="home__card" href="/settings">
            <span class="home__card-title">Настройки</span>
            <span class="home__card-note">Чат-клиенты, каналы и ключи подключения</span>
        </a>

        <!-- Разделы ниже ещё не сделаны. Кнопки оставлены на своих местах:
             меню должно показать, что задумано, и не давать тыкнуть в пустоту. -->
        <button type="button" class="home__card home__card--soon" disabled>
            <span class="home__card-title">Панель управления
                <span class="home__badge">скоро</span></span>
            <span class="home__card-note">Управление стримами и каналами в одном месте</span>
        </button>

        <button type="button" class="home__card home__card--soon" disabled>
            <span class="home__card-title">Каналы
                <span class="home__badge">скоро</span></span>
            <span class="home__card-note">Список каналов на всех площадках сразу</span>
        </button>

        <button type="button" class="home__card home__card--soon" disabled>
            <span class="home__card-title">Темы
                <span class="home__badge">скоро</span></span>
            <span class="home__card-note">Оформление интерфейса</span>
        </button>

    </nav>
</main>

<script type="module" src="/js/home.js"></script>
</body>
</html>
