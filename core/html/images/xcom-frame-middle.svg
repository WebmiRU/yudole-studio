<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56dfe9"/>
      <stop offset=".55" stop-color="#3fc6d2"/>
      <stop offset="1" stop-color="#54dce6"/>
