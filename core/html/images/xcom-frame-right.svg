<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" preserveAspectRatio="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55dfe9"/>
      <stop offset=".72" stop-color="#38bac7"/>
      <stop offset="1" stop-color="#c0fbff"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- The thin top/bottom rails enter the glowing sections at their centerlines. -->
    <g stroke="#4de3ed" stroke-width="5" opacity=".5" filter="url(#glow)">
      <path d="M155 64 L177 70 L198 91 L219 108 V258 H207 V278 H190 L178 286 H59 L41 278 H27"/>
    </g>
    <path d="M155 64 L177 70 L198 91 L219 108 V258 H207 V278 H190 L178 286 H59 L41 278 H27" stroke="url(#cyan)" stroke-width="3"/>

    <g stroke="#54dce7" stroke-width="1" opacity=".7">
      <path d="M0 64 H155"/>
      <path d="M0 278 H27"/>
    </g>

    <!-- Secondary unlit glints remain 1px and 70% opaque. -->
    <path d="M0 62.8 H154" stroke="#c9fdff" stroke-width="1" opacity=".7"/>
    <path d="M177 72 L198 93 L217 109 V255" stroke="#b9fbff" stroke-width="1" opacity=".7"/>
    <path d="M60 284 H178 L190 276 H204" stroke="#9df5fb" stroke-width="1" opacity=".7"/>
  </g>
</svg>