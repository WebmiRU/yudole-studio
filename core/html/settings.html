<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yudole studio light — настройки</title>
</head>
<body class="page-home">

<!-- Настройки — список разделов, а не раздел. Раньше /settings сразу отдавал
     комнаты, и второй пункт меню на них просто не вёлся: заходишь — и снова
     первый. Меню снимает вопрос, какой раздел по умолчанию. -->
<main class="home">
    <header class="home__head">
        <span class="home__mark" aria-hidden="true">◈</span>
        <span class="home__name">Настройки</span>
    </header>
    <p class="home__lead">Выберите раздел.</p>

    <nav class="home__grid" aria-label="Разделы настроек">

        <a class="home__card" href="/settings/rooms">
            <span class="home__card-title">Комнаты</span>
            <span class="home__card-note">Список комнат: заголовок, шрифт, тема и размеры</span>
        </a>

        <a class="home__card" href="/settings/clients">
            <span class="home__card-title">Чат-клиенты</span>
            <span class="home__card-note">Подключение к площадкам: каналы, ключи и параметры</span>
        </a>

    </nav>
</main>

<script type="module" src="/js/settings.js"></script>
</body>
</html>
