<svg xmlns="http://www.w3.org/2000/svg" width="721" height="264" viewBox="0 0 721 264" fill="none">
  <title>X-COM HUD frame outline</title>
  <desc>X-COM cyan HUD outline. Thin rails are 1px without glow; emphasized rails are 3px with cyan glow.</desc>
  <defs>
    <filter id="cyan-glow-wide" filterUnits="userSpaceOnUse" x="-24" y="-24" width="770" height="312" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.2" />
    </filter>
    <filter id="cyan-glow-tight" filterUnits="userSpaceOnUse" x="-24" y="-24" width="770" height="312" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
  </defs>
  <path id="continuous-cyan-underlay" d="M 24 14 H 204 L 232 42 H 667 L 694 69 V 249 H 539 L 520 230 H 56 L 24 198 Z" stroke="#54dce7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <g id="cyan-glow-wide" stroke="#54dce7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" filter="url(#cyan-glow-wide)">
    <path d="M 24 14 H 46" />
    <path d="M 184 14 H 204 L 232 42 H 256" />
    <path d="M 642 42 H 667 L 694 69 V 249 H 539 L 520 230 H 488" />
    <path d="M 77 230 H 56 L 24 198 V 14" />
  </g>
  <g id="cyan-glow-tight" stroke="#54dce7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.68" filter="url(#cyan-glow-tight)">
    <path d="M 24 14 H 46" />
    <path d="M 184 14 H 204 L 232 42 H 256" />
    <path d="M 642 42 H 667 L 694 69 V 249 H 539 L 520 230 H 488" />
    <path d="M 77 230 H 56 L 24 198 V 14" />
  </g>
  <g id="thin-cyan-rails" stroke="#54dce7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 46 14 H 184" />
    <path d="M 256 42 H 642" />
    <path d="M 77 230 H 488" />
  </g>
  <g id="cyan-core" stroke="#70edf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 14 H 46" />
    <path d="M 184 14 H 204 L 232 42 H 256" />
    <path d="M 642 42 H 667 L 694 69 V 249 H 539 L 520 230 H 488" />
    <path d="M 77 230 H 56 L 24 198 V 14" />
  </g>
</svg>
